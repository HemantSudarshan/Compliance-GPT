apiVersion: apps/v1
kind: Deployment
metadata:
  name: compliancegpt
  labels:
    app: compliancegpt
    version: v2.1
spec:
  replicas: 3
  selector:
    matchLabels:
      app: compliancegpt
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: compliancegpt
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: compliancegpt
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      
      containers:
        - name: compliancegpt
          image: ghcr.io/your-org/compliancegpt:latest
          imagePullPolicy: Always
          
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          
          env:
            - name: LLM_PROVIDER
              valueFrom:
                configMapKeyRef:
                  name: compliancegpt-config
                  key: llm_provider
            
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: compliancegpt-secrets
                  key: groq-api-key
            
            - name: WEAVIATE_URL
              valueFrom:
                secretKeyRef:
                  name: compliancegpt-secrets
                  key: weaviate-url
            
            - name: WEAVIATE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: compliancegpt-secrets
                  key: weaviate-api-key
            
            - name: RATE_LIMIT_REQUESTS
              valueFrom:
                configMapKeyRef:
                  name: compliancegpt-config
                  key: rate_limit
            
            - name: LOG_LEVEL
              value: "INFO"
          
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          
          volumeMounts:
            - name: logs
              mountPath: /app/logs
            - name: cache
              mountPath: /app/.cache
      
      volumes:
        - name: logs
          emptyDir: {}
        - name: cache
          emptyDir:
            sizeLimit: 1Gi
      
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - compliancegpt
                topologyKey: kubernetes.io/hostname

---
apiVersion: v1
kind: Service
metadata:
  name: compliancegpt
  labels:
    app: compliancegpt
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: compliancegpt

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: compliancegpt-config
data:
  llm_provider: "groq"
  rate_limit: "30"
  cache_ttl: "300"
  log_level: "INFO"

---
apiVersion: v1
kind: Secret
metadata:
  name: compliancegpt-secrets
type: Opaque
stringData:
  groq-api-key: "your-groq-api-key"
  weaviate-url: "your-weaviate-url"
  weaviate-api-key: "your-weaviate-api-key"

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: compliancegpt
  labels:
    app: compliancegpt

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: compliancegpt
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: compliancegpt
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: compliancegpt
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/rate-limit: "30"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
spec:
  tls:
    - hosts:
        - api.compliancegpt.ai
      secretName: compliancegpt-tls
  rules:
    - host: api.compliancegpt.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: compliancegpt
                port:
                  number: 80

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: compliancegpt
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: compliancegpt

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: compliancegpt
spec:
  podSelector:
    matchLabels:
      app: compliancegpt
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - to: []  # Allow all egress for API calls
      ports:
        - protocol: TCP
          port: 443
